name: 'Harness Reviewer'
description: 'AI-powered rules-based code review for pull requests'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  api-url:
    description: 'Model API URL (default: GitHub Models)'
    required: false
    default: 'https://models.github.ai'
  api-key:
    description: 'API key for model access (optional if exactly one common env var is set)'
    required: false
    default: ''
  model:
    description: 'Model to use (e.g., openai/gpt-4.1)'
    required: false
    default: 'openai/gpt-4.1'
  config-file:
    description: 'Path to hrev.yml config'
    required: false
    default: 'hrev.yml'
  base-ref:
    description: 'Base ref for diff comparison'
    required: false
    default: '${{ github.event.pull_request.base.sha }}'
  verbose:
    description: 'Show detailed rule output'
    required: false
    default: 'false'
  comment:
    description: 'Post review results as a PR comment'
    required: false
    default: 'true'
  status:
    description: 'Set commit status check'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install hrev
      shell: bash
      run: npm install -g @the-harness-dev/hrev

    - name: Detect API key
      id: detect
      shell: bash
      run: |
        # If user explicitly provided api-key, use it
        if [ -n "${{ inputs.api-key }}" ]; then
          echo "api_key=${{ inputs.api-key }}" >> "$GITHUB_OUTPUT"
          echo "Using explicitly provided API key"
          exit 0
        fi

        # Count available env vars
        count=0
        key=""
        name=""

        if [ -n "$HREV_API_KEY" ]; then
          count=$((count + 1))
          key="$HREV_API_KEY"
          name="HREV_API_KEY"
        fi
        if [ -n "$OPENAI_API_KEY" ]; then
          count=$((count + 1))
          key="$OPENAI_API_KEY"
          name="OPENAI_API_KEY"
        fi
        if [ -n "$ANTHROPIC_API_KEY" ]; then
          count=$((count + 1))
          key="$ANTHROPIC_API_KEY"
          name="ANTHROPIC_API_KEY"
        fi
        if [ -n "$GROQ_API_KEY" ]; then
          count=$((count + 1))
          key="$GROQ_API_KEY"
          name="GROQ_API_KEY"
        fi

        if [ "$count" -eq 0 ]; then
          echo "❌ No API key found." >&2
          echo "" >&2
          echo "Add one of these to your workflow env:" >&2
          echo "  HREV_API_KEY — recommended, provider-agnostic" >&2
          echo "  OPENAI_API_KEY — if you use OpenAI" >&2
          echo "  ANTHROPIC_API_KEY — if you use Anthropic" >&2
          echo "  GROQ_API_KEY — if you use Groq" >&2
          echo "" >&2
          echo "Example:" >&2
          echo "  - uses: the-harness-dev/hrev@v1" >&2
          echo "    env:" >&2
          echo "      HREV_API_KEY: <your-api-key-secret>" >&2
          echo "" >&2
          echo "Or pass api-key explicitly:" >&2
          echo "  - uses: the-harness-dev/hrev@v1" >&2
          echo "    with:" >&2
          echo "      api-key: <your-api-key>" >&2
          exit 1
        fi

        if [ "$count" -gt 1 ]; then
          echo "❌ Multiple API keys detected in env. Cannot disambiguate." >&2
          echo "" >&2
          echo "Pass the one you want to use:" >&2
          echo "  - uses: the-harness-dev/hrev@v1" >&2
          echo "    with:" >&2
          echo "      api-key: <your-api-key>" >&2
          echo "" >&2
          echo "Or unset the ones you don't want to use." >&2
          exit 1
        fi

        echo "api_key=$key" >> "$GITHUB_OUTPUT"
        echo "Auto-detected $name"

    - name: Run code review
      id: hrev
      shell: bash
      run: |
        if [ "${{ inputs.verbose }}" = "true" ]; then
          hrev --config ${{ inputs.config-file }} --base ${{ inputs.base-ref }} --verbose --json > "$GITHUB_WORKSPACE/hrev-output.json"
        else
          hrev --config ${{ inputs.config-file }} --base ${{ inputs.base-ref }} --json > "$GITHUB_WORKSPACE/hrev-output.json"
        fi
        cat "$GITHUB_WORKSPACE/hrev-output.json"
      env:
        HREV_API_URL: ${{ inputs.api-url }}
        HREV_API_KEY: ${{ steps.detect.outputs.api_key }}
        HREV_MODEL: ${{ inputs.model }}
      continue-on-error: true

    - name: Parse results
      id: parse
      shell: bash
      run: |
        passed=$(jq -r '.passed' "$GITHUB_WORKSPACE/hrev-output.json")
        summary=$(jq -r '.summary' "$GITHUB_WORKSPACE/hrev-output.json")
        echo "passed=$passed" >> "$GITHUB_OUTPUT"
        {
          printf '## '
          if [ "$passed" = "true" ]; then printf '✅'; else printf '❌'; fi
          printf ' Harness Reviewer\n\n%s\n' "$summary"
        } > "$GITHUB_WORKSPACE/hrev-comment.md"

    - name: Post PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment ${{ github.event.pull_request.number }} \
          --repo ${{ github.repository }} \
          --body-file "$GITHUB_WORKSPACE/hrev-comment.md"

    - name: Set commit status
      if: ${{ inputs.status == 'true' }}
      shell: bash
      run: |
        if [ "${{ steps.parse.outputs.passed }}" = "true" ]; then
          state="success"
        else
          state="failure"
        fi

        curl -X POST \
          -H "Authorization: Bearer ${{ github.token }}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
          -d "{\"state\":\"$state\",\"context\":\"harness-reviewer\",\"description\":\"AI code review $state\"}"

    - name: Fail if review failed
      shell: bash
      run: |
        if [ "${{ steps.parse.outputs.passed }}" != "true" ]; then
          echo "Review failed — see comment above for details"
          exit 1
        fi
