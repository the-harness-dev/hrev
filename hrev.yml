rules:
  - id: node-logging
    description: Agent nodes should log when they are entered, their prompt, tool calls, and results
    severity: blocker
    path: src/
  - id: per-rule-reasoning-output
    description: The review output must include human-readable reasoning for each
      individual rule result, explaining the rationale for pass or fail. Do not
      emit only aggregated pass/fail counts.
    severity: general
    path: src/
